<!doctype html>
<!--
  PROTOTYPE — THROWAWAY. Delete when issue #13 resolves.
  Question: what does the candid-cv gap-filling Interview FEEL like over a long session?
  Three variants of the same interview, switchable via ?variant= and the floating bar.
  Answers are in-memory only. Nothing is written to disk. Nothing is real.
  Schema shown in the state panels is the settled one from issue #9.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>candid-cv — interview prototype</title>
<style>
  :root{
    --bg:#0e0f13; --bg2:#15171d; --bg3:#1c1f27; --line:#282c37;
    --ink:#e8e9ee; --ink2:#a3a8b8; --ink3:#6d7386;
    --accent:#c8a45c; --accent2:#7fb3a8; --warn:#d98b6a;
    --mono:ui-monospace,"SF Mono",Menlo,monospace;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);
       font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;cursor:pointer}
  textarea,input{font:inherit;color:inherit}

  /* ---------- chrome ---------- */
  .topbar{position:sticky;top:0;z-index:40;background:rgba(14,15,19,.86);
    backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
    padding:10px 20px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  .topbar .brand{font-family:var(--serif);font-size:16px;letter-spacing:.01em}
  .topbar .brand em{color:var(--accent);font-style:normal}
  .topbar .vname{font-size:13px;color:var(--ink2)}
  .topbar .vname b{color:var(--ink)}
  .topbar .spacer{flex:1}
  .ghost{background:none;border:1px solid var(--line);border-radius:6px;
    padding:4px 10px;font-size:12px;color:var(--ink2)}
  .ghost:hover{border-color:var(--ink3);color:var(--ink)}

  .stage{max-width:1180px;margin:0 auto;padding:26px 20px 120px}

  /* ---------- shared bits ---------- */
  .kicker{font-family:var(--mono);font-size:11px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--ink3)}
  .lede{font-family:var(--serif);font-size:clamp(21px,2.6vw,29px);line-height:1.3;
    margin:6px 0 14px;max-width:26ch}
  .sub{color:var(--ink2);max-width:62ch}
  .pill{display:inline-block;font-family:var(--mono);font-size:11px;
    border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--ink3)}

  .btn{background:var(--accent);color:#17130a;border:none;border-radius:8px;
    padding:10px 18px;font-weight:600}
  .btn:hover{filter:brightness(1.08)}
  .btn.sec{background:none;border:1px solid var(--line);color:var(--ink2);font-weight:400}
  .btn.sec:hover{border-color:var(--ink3);color:var(--ink)}
  .btn:disabled{opacity:.35;cursor:not-allowed;filter:none}

  ta, textarea{width:100%;background:var(--bg2);border:1px solid var(--line);
    border-radius:10px;padding:12px 14px;color:var(--ink);resize:vertical;min-height:96px}
  textarea:focus{outline:none;border-color:var(--accent2)}
  textarea::placeholder{color:var(--ink3)}

  /* option cards */
  .opts{display:grid;gap:8px;margin-top:12px}
  .opt{display:block;width:100%;text-align:left;background:var(--bg2);
    border:1px solid var(--line);border-radius:10px;padding:11px 14px}
  .opt:hover{border-color:var(--ink3);background:var(--bg3)}
  .opt.on{border-color:var(--accent);background:#241f13}
  .opt .ol{font-weight:600}
  .opt .od{font-size:12.5px;color:var(--ink3);margin-top:2px}

  /* progress */
  .bar{height:3px;background:var(--bg3);border-radius:2px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--accent);transition:width .35s}

  /* ---------- VARIANT A : the blitz ---------- */
  .a-head{display:flex;align-items:flex-end;gap:20px;margin-bottom:18px;flex-wrap:wrap}
  .a-head .count{font-family:var(--mono);font-size:12px;color:var(--ink3);margin-left:auto}
  .a-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:14px}
  .a-card{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:16px}
  .a-card .q{font-weight:600;margin-bottom:2px;line-height:1.35}
  .a-card .hint{font-size:12px;color:var(--ink3);margin-bottom:10px}
  .a-card .opt{padding:8px 11px;font-size:14px}
  .a-card textarea{min-height:78px;font-size:14px}
  .a-foot{display:flex;align-items:center;gap:14px;margin-top:20px}
  .a-foot .note{font-size:12.5px;color:var(--ink3)}

  /* ---------- VARIANT B : the conversation ---------- */
  .b-wrap{max-width:720px;margin:0 auto}
  .b-log{display:flex;flex-direction:column;gap:18px;margin-bottom:26px}
  .b-them{font-family:var(--serif);font-size:19px;line-height:1.45}
  .b-them .re{display:block;font-family:var(--sans);font-size:13.5px;
    color:var(--accent2);margin-bottom:6px;font-style:italic}
  .b-me{align-self:flex-end;max-width:88%;background:var(--bg3);
    border:1px solid var(--line);border-radius:12px 12px 3px 12px;padding:10px 14px;
    color:var(--ink2);font-size:14px;white-space:pre-wrap}
  .b-now{border-left:2px solid var(--accent);padding-left:18px}
  .b-inline{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .b-inline button{background:var(--bg2);border:1px solid var(--line);
    border-radius:999px;padding:6px 14px;font-size:13.5px}
  .b-inline button:hover{border-color:var(--accent);color:var(--ink)}
  .b-tell{font-size:12.5px;color:var(--ink3);margin-top:10px;display:flex;
    gap:14px;align-items:center;flex-wrap:wrap}

  /* ---------- VARIANT C : the workbench ---------- */
  .c-split{display:grid;grid-template-columns:minmax(320px,1.05fr) minmax(300px,.95fr);
    gap:22px;align-items:start}
  @media(max-width:900px){.c-split{grid-template-columns:1fr}}
  .c-file{background:var(--bg2);border:1px solid var(--line);border-radius:14px;
    overflow:hidden;position:sticky;top:66px}
  .c-file .fh{padding:10px 14px;border-bottom:1px solid var(--line);
    font-family:var(--mono);font-size:11.5px;color:var(--ink3);
    display:flex;justify-content:space-between;gap:10px}
  .c-file .fb{padding:12px 14px;font-family:var(--mono);font-size:12px;
    line-height:1.7;max-height:60vh;overflow:auto;white-space:pre-wrap}
  .y-k{color:var(--accent2)}.y-v{color:var(--ink)}.y-c{color:var(--ink3)}
  .y-new{background:#241f13;border-radius:3px}
  .c-entries{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
  .c-ent{display:flex;align-items:center;gap:12px;background:var(--bg2);
    border:1px solid var(--line);border-radius:10px;padding:10px 13px;width:100%;text-align:left}
  .c-ent.on{border-color:var(--accent)}
  .c-ent .t{flex:1;min-width:0}
  .c-ent .t b{display:block;font-size:14px}
  .c-ent .t span{font-size:12px;color:var(--ink3)}
  .c-ent .m{width:64px}
  .c-ent .m .bar{height:5px}
  .c-ent .m span{font-family:var(--mono);font-size:10px;color:var(--ink3)}
  .c-q{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:18px}

  .done{text-align:center;padding:50px 0}
  .done .big{font-family:var(--serif);font-size:30px;margin-bottom:8px}

  /* ---------- switcher ---------- */
  .switch{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:90;
    display:flex;align-items:center;gap:2px;background:#f2f3f7;color:#14161c;
    border-radius:999px;padding:5px 6px;box-shadow:0 10px 34px rgba(0,0,0,.55)}
  .switch button{background:none;border:none;border-radius:999px;
    width:30px;height:30px;font-size:15px;color:#14161c}
  .switch button:hover{background:#dcdee6}
  .switch .lab{font-size:12.5px;font-weight:600;padding:0 12px;white-space:nowrap}
  .switch .lab small{font-weight:400;opacity:.6}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">candid&#8209;cv <em>· interview prototype</em></div>
  <div class="vname" id="vname"></div>
  <div class="spacer"></div>
  <button class="ghost" id="peek">what's been captured</button>
  <button class="ghost" id="reset">restart</button>
</div>

<div class="stage" id="stage"></div>

<div class="switch" id="switch"></div>

<script>
/* ============================================================
   SHARED MODEL
   The question bank is deliberately about YOUR real career, so
   the recall effort — and therefore the fatigue — is genuine.
   Ingestion is simulated: a skeleton "read from your old CV",
   atoms marked source: ingested, no quotes. See issue #9.
   ============================================================ */

const SEED = {
  entries: [
    {id:'cur', title:'[your current / most recent role]', org:'[employer]', span:'ingested from CV', atoms:2},
    {id:'prev', title:'[the role before that]', org:'[employer]', span:'ingested from CV', atoms:1},
    {id:'old', title:'[anything earlier]', org:'', span:'title + dates only', atoms:0},
  ],
  orphanSkills: ['a tool your CV lists but never explains']
};

// type: card | multi | text ; entry: which Entry it feeds ; depth: 1 = surface, 2 = follow-up
const BANK = [
  {id:'q1', entry:'cur', depth:1, type:'card', q:'Your most recent role — where does it stand?',
   hint:'Ingestion read an end date but I do not trust it.',
   opts:[['Still there','ongoing'],['Ended within the last year',''],['Ended 1–3 years ago',''],['Longer ago than that','']]},

  {id:'q2', entry:'cur', depth:1, type:'card', q:'What was your actual scope there?',
   hint:'Not your job title — what you were on the hook for.',
   opts:[['Individual contributor','you owned your own work'],['Tech lead','you owned a direction, no reports'],['Manager','people reported to you'],['Founder / owner','the buck stopped with you']]},

  {id:'q3', entry:'cur', depth:1, type:'card', q:'How many people were you working alongside day to day?',
   hint:'Rough is fine. This is scale context, not a metric.',
   opts:[['Solo',''],['2–5',''],['6–15',''],['15+','']]},

  {id:'q4', entry:'cur', depth:1, type:'text', q:'Name the one thing you built, fixed or changed in that role that you would most want a hiring manager to know about.',
   hint:'One sentence. We will dig into it next.', ph:'e.g. "I replaced the nightly batch pipeline with a streaming one."'},

  {id:'q5', entry:'cur', depth:2, type:'text', q:'What was it like before you did that, and what was it like after?',
   hint:'The contrast is the whole story. Numbers if you have them, hedges welcome — "roughly", "I think" all survive into the profile verbatim.',
   ph:'e.g. "Data was ~6 hours stale, finance complained every Monday. After, under 2 minutes."'},

  {id:'q6', entry:'cur', depth:2, type:'text', q:'Who else was on it, and which part was genuinely yours?',
   hint:'This is the question that keeps the CV honest later.', ph:'e.g. "Two of us. I did the Kafka side and the cutover plan; she did Snowflake."'},

  {id:'q7', entry:'cur', depth:2, type:'text', q:'What broke, or nearly did?',
   hint:'Nothing goes on the CV. Failure detail is what makes the successes legible.', ph:''},

  {id:'q8', entry:'cur', depth:2, type:'card', q:'Is there anything public that would prove any of this?',
   hint:'Fills the atom’s evidence field. "Nothing public" is a normal answer.',
   opts:[['A public repo or PR',''],['A talk, post or paper',''],['Internal only',''],['Nothing that survives','']]},

  {id:'q9', entry:'cur', depth:2, type:'text', q:'Say — in your own words, however you would say it out loud — why that mattered.',
   hint:'This one is quoted verbatim into the profile. It is where your voice comes from later, so do not tidy it up.',
   ph:'e.g. "Finance stopped yelling at us on Mondays. That was the whole point, honestly."', quote:true},

  {id:'q10', entry:'cur', depth:2, type:'multi', q:'Which of these did that work actually exercise?',
   hint:'Tags the atom. A skill with no atom behind it can never reach the CV.',
   opts:[['A specific tool or language',''],['Architecture / system design',''],['Leading or convincing people',''],['Operating it in production',''],['Working out what to build at all','']]},

  {id:'q11', entry:'cur', depth:1, type:'text', q:'Second thing from that role. Different in kind from the first — if the first was technical, make this one about people, or judgement, or a mess you cleaned up.',
   hint:'', ph:''},

  {id:'q12', entry:'cur', depth:1, type:'text', q:'Your CV lists tools you never tell a story about. Pick the one you actually used most and tell me where and how much.',
   hint:'This becomes a Competence Atom — everyday use, no headline project. It is how a real skill with no story still stays evidenced.',
   ph:'e.g. "Terraform, daily, all our AWS infra across both roles. No single project."'},

  {id:'q13', entry:'prev', depth:1, type:'card', q:'Moving back a role. Why did you leave?',
   hint:'Never printed. It tells me which of your strengths were actually load-bearing.',
   opts:[['Pulled toward something better',''],['Pushed — it had gone bad',''],['The role ended under me',''],['Just time','']]},

  {id:'q14', entry:'prev', depth:1, type:'text', q:'What did you do there that you are still slightly proud of?',
   hint:'', ph:''},

  {id:'q15', entry:'prev', depth:2, type:'text', q:'And what did that take out of you — what was hard about it?',
   hint:'', ph:''},

  {id:'q16', entry:'prev', depth:2, type:'card', q:'How long did that run?',
   hint:'', opts:[['Weeks',''],['A few months',''],['Most of a year',''],['Years','']]},

  {id:'q17', entry:'prev', depth:1, type:'text', q:'Anything you learned there that you still use every week?',
   hint:'', ph:''},

  {id:'q18', entry:'old', depth:1, type:'card', q:'Everything earlier than that — how should I treat it?',
   hint:'Old roles usually need dates and one line, not an excavation.',
   opts:[['Dates and titles only, skip it',''],['One good story from the whole period',''],['There is something important back there','']]},

  {id:'q19', entry:'old', depth:1, type:'text', q:'Last one for now: what do people repeatedly come to you for, that no job title of yours has ever described?',
   hint:'The atom that never survives a CV rewrite. It is usually the best one.', ph:''},

  {id:'q20', entry:'old', depth:1, type:'card', q:'How is your energy?',
   hint:'Asked for real — the interview stops when you say so, not when a counter runs out.',
   opts:[['Fine, keep going',''],['Getting thin — wrap this entry and stop',''],['Done for today','']]},
];

const S = {
  answers: {},      // qid -> {value, label}
  cursor: 0,        // index into BANK for A and B
  started: false,
  entryFocus: 'cur',
  log: []
};

const REACTIONS = {
  q4:'Good — that is an Entry with something in it. Now the part your old CV flattened.',
  q5:'Noted. I am keeping your hedges exactly as you wrote them; sharpening "roughly" into a number is the thing this whole skill refuses to do.',
  q6:'That is the attribution line. It is why a bullet from this can survive being asked about.',
  q7:'Not going anywhere near the CV. It just tells me how hard the good part actually was.',
  q9:'That goes in verbatim, as your quote. Everything written later gets pulled back toward it.',
  q11:'Different register — good. Two atoms of the same flavour would compete for the same slot.',
  q12:'Filed as a competence atom. Real, evidenced, no story invented to prop it up.',
  q14:'Right. That is this Entry started.',
  q15:'That is the one people leave out, and it is usually where the evidence is.',
  q19:'That is usually the atom nothing on your CV currently carries.'
};

/* ---------- derived state ---------- */
function answered(){ return Object.keys(S.answers).length }
function atomsFor(eid){
  const base = (SEED.entries.find(e=>e.id===eid)||{}).atoms || 0;
  const rich = BANK.filter(q=>q.entry===eid && q.type==='text' && S.answers[q.id]).length;
  return base + rich;
}
function coverage(eid){
  const qs = BANK.filter(q=>q.entry===eid);
  const got = qs.filter(q=>S.answers[q.id]).length;
  return qs.length ? got/qs.length : 0;
}
function quoteAnswer(){
  const a = S.answers['q9']; return a ? a.value : null;
}

/* ---------- YAML preview (the real artifact, per #9) ---------- */
function yamlFor(eid){
  const ent = SEED.entries.find(e=>e.id===eid);
  const L = [];
  const k=(s)=>`<span class="y-k">${s}</span>`, c=(s)=>`<span class="y-c">${s}</span>`;
  L.push(`${k('kind:')} role`);
  L.push(`${k('title:')} ${ent.title}`);
  L.push(`${k('org:')} ${ent.org||'—'}`);
  L.push(`${k('start:')} 20XX-XX`);
  L.push(`${k('end:')} ${S.answers.q1 && S.answers.q1.value==='ongoing' ? 'null'+c('   # ongoing') : '20XX-XX'}`);
  L.push(`${k('atoms:')}`);
  if(eid==='cur'){
    L.push(`  - ${k('id:')} ingested-1`);
    L.push(`    ${k('fact:')} >`);
    L.push(`      ${c('(neutral restatement from your old CV,')}`);
    L.push(`      ${c(' framing discarded)')}`);
    L.push(`    ${k('source:')} ingested   ${c('# no quote — this is a gap')}`);
  }
  BANK.filter(q=>q.entry===eid && q.type==='text' && S.answers[q.id] && !q.quote).forEach((q,i)=>{
    const v = S.answers[q.id].value.trim().replace(/\s+/g,' ');
    L.push(`  <span class="y-new">- ${k('id:')} ${eid}-atom-${i+1}</span>`);
    L.push(`    ${k('fact:')} >`);
    L.push(`      ${esc(v.slice(0,150))}${v.length>150?'…':''}`);
    const dem = S.answers.q10 ? S.answers.q10.value : null;
    if(i===0 && dem) L.push(`    ${k('demonstrates:')} [${esc(dem)}]`);
    if(i===0 && quoteAnswer()){
      L.push(`    ${k('quote:')} "${esc(quoteAnswer().slice(0,90))}${quoteAnswer().length>90?'…':''}"`);
    }
    if(i===0 && S.answers.q8) L.push(`    ${k('evidence:')} ${esc(S.answers.q8.label)}`);
    L.push(`    ${k('source:')} interview`);
  });
  if(L.length===6) L.push(`  ${c('# nothing from the interview yet')}`);
  return L.join('\n');
}
function esc(s){ return String(s).replace(/[<>&]/g,m=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[m])) }

/* ============================================================
   VARIANT A — THE BLITZ
   Card-maximal, four questions on screen at once, visible counter,
   momentum as the design goal. Free text only where a card cannot hold it.
   ============================================================ */
function renderA(){
  const stage = el('stage');
  if(!S.started) return stage.innerHTML = introA();
  const batch = BANK.slice(S.cursor, S.cursor+4);
  if(!batch.length) return stage.innerHTML = doneScreen('A');

  const pct = Math.round(S.cursor/BANK.length*100);
  stage.innerHTML = `
    <div class="a-head">
      <div>
        <div class="kicker">gap-filling interview · batch ${Math.floor(S.cursor/4)+1} of ${Math.ceil(BANK.length/4)}</div>
        <div class="lede" style="margin-bottom:4px">Four at a time.<br>Keep moving.</div>
      </div>
      <div class="count">${S.cursor} / ${BANK.length} answered · ~${Math.max(1,Math.round((BANK.length-S.cursor)*0.6))} min left</div>
    </div>
    <div class="bar" style="margin-bottom:20px"><i style="width:${pct}%"></i></div>
    <div class="a-grid">
      ${batch.map(q=>cardA(q)).join('')}
    </div>
    <div class="a-foot">
      <button class="btn" id="next">Next four →</button>
      <button class="btn sec" id="skip">Skip this batch</button>
      <span class="note">Skipping is free. Anything left blank stays a gap and comes back later.</span>
    </div>`;

  batch.forEach(q=>wireQ(q, renderA));
  el('next').onclick = ()=>{ S.cursor+=4; window.scrollTo(0,0); renderA() };
  el('skip').onclick = ()=>{ S.cursor+=4; window.scrollTo(0,0); renderA() };
}
function cardA(q){
  const a = S.answers[q.id];
  return `<div class="a-card" data-q="${q.id}">
    <div class="q">${q.q}</div>
    ${q.hint?`<div class="hint">${q.hint}</div>`:''}
    ${q.type==='text'
      ? `<textarea data-t="${q.id}" placeholder="${q.ph||''}">${a?esc(a.value):''}</textarea>`
      : `<div class="opts">${q.opts.map((o,i)=>
          `<button class="opt ${a&&(q.type==='multi'?a.value.includes(o[0]):a.label===o[0])?'on':''}" data-o="${q.id}|${i}">
             <div class="ol">${o[0]}</div>${o[1]?`<div class="od">${o[1]}</div>`:''}
           </button>`).join('')}
         ${q.type!=='multi'?`<button class="opt" data-other="${q.id}"><div class="ol" style="color:var(--ink3)">Other — let me type it</div></button>`:''}
        </div>`}
  </div>`;
}

function introA(){
  return `<div style="max-width:620px">
    <div class="kicker">before we start</div>
    <div class="lede">I read your CV. Most of what is in it is unusable.</div>
    <p class="sub">Not wrong — <em>flattened</em>. "Responsible for cross-functional stakeholder alignment" is a sentence that survived three rewrites and now says nothing. I have kept the skeleton (3 entries, dates, employers) and thrown the phrasing away. Everything I kept is marked <code style="font-family:var(--mono);font-size:12px;color:var(--accent2)">source: ingested</code> and has no quote against it — that is exactly what a gap looks like.</p>
    <p class="sub">This variant asks fast, four at a time, mostly as cards.</p>
    <p class="sub"><span class="pill">~20 questions</span> <span class="pill">about 12 minutes</span> <span class="pill">stop whenever</span></p>
    <p style="margin-top:24px"><button class="btn" onclick="S.started=true;render()">Start the blitz</button></p>
  </div>`;
}

/* ============================================================
   VARIANT B — THE CONVERSATION
   One open question at a time, free text first. The interviewer
   reacts before it asks again. Cards appear only as inline clarifiers.
   No progress bar anywhere — deliberately.
   ============================================================ */
function renderB(){
  const stage = el('stage');
  if(!S.started) return stage.innerHTML = introB();
  const q = BANK[S.cursor];
  if(!q) return stage.innerHTML = doneScreen('B');

  const prev = BANK[S.cursor-1];
  const reaction = prev && REACTIONS[prev.id] ? REACTIONS[prev.id] : null;

  stage.innerHTML = `<div class="b-wrap">
    <div class="b-log">
      ${S.log.slice(-4).map(l=>l.me
        ? `<div class="b-me">${esc(l.text)}</div>`
        : `<div class="b-them" style="opacity:.42">${l.text}</div>`).join('')}
    </div>
    <div class="b-them b-now">
      ${reaction?`<span class="re">${reaction}</span>`:''}
      ${q.q}
    </div>
    ${q.hint?`<p class="sub" style="font-size:13.5px;margin-top:10px">${q.hint}</p>`:''}
    ${q.type==='text'
      ? `<div style="margin-top:14px"><textarea data-t="${q.id}" placeholder="${q.ph||''}">${S.answers[q.id]?esc(S.answers[q.id].value):''}</textarea></div>`
      : `<div class="b-inline">${q.opts.map((o,i)=>`<button data-o="${q.id}|${i}">${o[0]}</button>`).join('')}
         ${q.type!=='multi'?`<button data-other="${q.id}" style="color:var(--ink3)">something else</button>`:''}</div>`}
    <div class="b-tell">
      <button class="btn" id="next" style="padding:8px 16px">Send</button>
      <button class="btn sec" id="skip" style="padding:8px 16px">I don't remember</button>
      <span>${atomsTally()}</span>
    </div>
  </div>`;

  wireQ(q, renderB);
  el('next').onclick = advanceB;
  el('skip').onclick = ()=>{ pushLog(q,'—'); S.cursor++; renderB() };
  const t = document.querySelector('[data-t]');
  if(t){ t.focus(); t.onkeydown = e=>{ if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)) advanceB() } }
}
function advanceB(){
  const q = BANK[S.cursor];
  const t = document.querySelector('[data-t]');
  if(t) S.answers[q.id] = {value:t.value, label:t.value};
  pushLog(q, S.answers[q.id]?S.answers[q.id].label:'—');
  S.cursor++; window.scrollTo(0,0); renderB();
}
function pushLog(q, ans){ S.log.push({me:false,text:q.q}); S.log.push({me:true,text:ans||'—'}) }
function atomsTally(){
  const n = BANK.filter(q=>q.type==='text'&&S.answers[q.id]).length;
  if(!n) return 'nothing captured yet';
  return `${n} atom${n>1?'s':''} captured${quoteAnswer()?', 1 in your own words':''}`;
}
function introB(){
  return `<div class="b-wrap">
    <div class="kicker">before we start</div>
    <div class="lede">I have read your CV, and I am going to ignore most of how it is written.</div>
    <p class="sub">The facts underneath it are fine. The phrasing is three rewrites of sanding, and it has sanded off everything a person would find interesting. So I kept the skeleton and dropped the language.</p>
    <p class="sub">This variant is a conversation. One question at a time, mostly open. I will push when an answer is thin, and I will not show you a progress bar, because there is no number of questions at which a career is finished.</p>
    <p class="sub"><span class="pill">as long as you want</span> <span class="pill">stop mid-sentence, it resumes</span></p>
    <p style="margin-top:24px"><button class="btn" onclick="S.started=true;render()">Start talking</button></p>
  </div>`;
}

/* ============================================================
   VARIANT C — THE WORKBENCH
   The profile file IS the interface. You pick an Entry, work it to
   whatever depth you want, and watch atoms land in the YAML as you go.
   Coverage meters make the stopping rule visible and user-owned.
   ============================================================ */
function renderC(){
  const stage = el('stage');
  if(!S.started) return stage.innerHTML = introC();
  const qs = BANK.filter(q=>q.entry===S.entryFocus);
  const q = qs.find(x=>!S.answers[x.id]);

  stage.innerHTML = `<div class="c-split">
    <div>
      <div class="kicker">your profile · 3 entries · ${SEED.entries.reduce((n,e)=>n+atomsFor(e.id),0)} atoms</div>
      <div class="lede" style="font-size:22px;margin:6px 0 16px">Pick what to work on.</div>
      <div class="c-entries">
        ${SEED.entries.map(e=>{
          const cv=Math.round(coverage(e.id)*100);
          return `<button class="c-ent ${e.id===S.entryFocus?'on':''}" data-e="${e.id}">
            <div class="t"><b>${e.title}</b><span>${e.org||e.span} · ${atomsFor(e.id)} atoms</span></div>
            <div class="m"><div class="bar"><i style="width:${cv}%"></i></div><span>${cv}% asked</span></div>
          </button>`}).join('')}
      </div>
      ${q ? `<div class="c-q">
          <div class="kicker" style="margin-bottom:8px">question ${qs.indexOf(q)+1} of ${qs.length} for this entry</div>
          <div style="font-weight:600;font-size:16px;line-height:1.4;margin-bottom:4px">${q.q}</div>
          ${q.hint?`<div style="font-size:13px;color:var(--ink3);margin-bottom:12px">${q.hint}</div>`:''}
          ${q.type==='text'
            ? `<textarea data-t="${q.id}" placeholder="${q.ph||''}"></textarea>`
            : `<div class="opts">${q.opts.map((o,i)=>`<button class="opt" data-o="${q.id}|${i}"><div class="ol">${o[0]}</div>${o[1]?`<div class="od">${o[1]}</div>`:''}</button>`).join('')}
               ${q.type!=='multi'?`<button class="opt" data-other="${q.id}"><div class="ol" style="color:var(--ink3)">Other</div></button>`:''}</div>`}
          <div style="display:flex;gap:10px;margin-top:14px;align-items:center;flex-wrap:wrap">
            <button class="btn" id="next" style="padding:8px 16px">Save atom</button>
            <button class="btn sec" id="skip" style="padding:8px 16px">Skip</button>
            <span style="font-size:12.5px;color:var(--ink3)">This entry is good enough to stop at any time.</span>
          </div>
        </div>`
        : `<div class="c-q"><div style="font-family:var(--serif);font-size:19px">This entry is fully asked.</div>
           <p class="sub" style="font-size:13.5px">Pick another entry above, or stop — the file on the right is already valid on its own.</p></div>`}
    </div>
    <div class="c-file">
      <div class="fh"><span>~/.candid-cv/entries/${S.entryFocus}.yaml</span><span>saved</span></div>
      <div class="fb">${yamlFor(S.entryFocus)}</div>
    </div>
  </div>`;

  document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{S.entryFocus=b.dataset.e;renderC()});
  if(q){
    wireQ(q, renderC);
    el('next').onclick=()=>{
      const t=document.querySelector('[data-t]');
      if(t&&t.value.trim()) S.answers[q.id]={value:t.value,label:t.value};
      else if(!S.answers[q.id]) S.answers[q.id]={value:'—',label:'—'};
      renderC();
    };
    el('skip').onclick=()=>{S.answers[q.id]={value:'—',label:'skipped'};renderC()};
  }
}
function introC(){
  return `<div style="max-width:640px">
    <div class="kicker">before we start</div>
    <div class="lede">Here is what I got out of your CV. It is thinner than it looks.</div>
    <p class="sub">Three entries, dates, employers, and a handful of restated facts. I deliberately did not keep the wording — a line like "responsible for cross-functional stakeholder alignment" would poison a file that is supposed to hold what actually happened. Everything I kept is <code style="font-family:var(--mono);font-size:12px;color:var(--accent2)">source: ingested</code>, no quotes, which is precisely the query that finds the gaps.</p>
    <p class="sub">In this variant you drive. Pick an entry, answer as much as you feel like, watch the file fill up, stop when the file looks right to you.</p>
    <p class="sub"><span class="pill">no fixed length</span> <span class="pill">one entry at a time</span> <span class="pill">the file is the progress bar</span></p>
    <p style="margin-top:24px"><button class="btn" onclick="S.started=true;render()">Open the profile</button></p>
  </div>`;
}

/* ---------- shared wiring ---------- */
function wireQ(q, rerender){
  document.querySelectorAll(`[data-o^="${q.id}|"]`).forEach(b=>{
    b.onclick=()=>{
      const i=+b.dataset.o.split('|')[1], lab=q.opts[i][0];
      if(q.type==='multi'){
        const cur=S.answers[q.id]?S.answers[q.id].value:[];
        const nx=cur.includes(lab)?cur.filter(x=>x!==lab):[...cur,lab];
        S.answers[q.id]={value:nx,label:nx.join(', ')};
      } else {
        S.answers[q.id]={value:q.opts[i][1]||lab,label:lab};
      }
      rerender();
    };
  });
  document.querySelectorAll(`[data-other="${q.id}"]`).forEach(b=>{
    b.onclick=()=>{ q.type='text'; q.ph='in your own words…'; rerender() };
  });
  document.querySelectorAll(`[data-t="${q.id}"]`).forEach(t=>{
    t.onblur=()=>{ if(t.value.trim()) S.answers[q.id]={value:t.value,label:t.value} };
  });
}

function doneScreen(v){
  const atoms = SEED.entries.reduce((n,e)=>n+atomsFor(e.id),0);
  return `<div class="done">
    <div class="big">That is a profile.</div>
    <p class="sub" style="margin:0 auto">${atoms} atoms across 3 entries${quoteAnswer()?', one carrying your own words verbatim':''}. Written to <code style="font-family:var(--mono);font-size:12.5px">~/.candid-cv/entries/</code>, one file per entry.</p>
    <p class="sub" style="margin:14px auto 0;font-size:13.5px;color:var(--ink3)">Variant ${v}. Now the real question: how did that feel at question 15 compared with question 3?</p>
    <p style="margin-top:22px"><button class="btn sec" onclick="doReset()">Run it again</button></p>
  </div>`;
}

/* ---------- peek drawer ---------- */
function peek(){
  const lines = SEED.entries.map(e=>`<div style="margin-bottom:18px">
      <div class="kicker" style="margin-bottom:6px">entries/${e.id}.yaml</div>
      <div style="font-family:var(--mono);font-size:12px;line-height:1.7;white-space:pre-wrap;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:12px 14px">${yamlFor(e.id)}</div>
    </div>`).join('');
  el('stage').innerHTML = `<div style="max-width:760px">
    <div class="kicker">state · what the interview has written so far</div>
    <div class="lede" style="font-size:22px">The profile, right now.</div>
    ${lines}
    <button class="btn sec" onclick="render()">← back to the interview</button>
  </div>`;
}

/* ---------- switcher ---------- */
const VARIANTS = [
  ['A','The Blitz','four cards at a time, counter running'],
  ['B','The Conversation','one open question, it talks back'],
  ['C','The Workbench','the profile file is the interface'],
];
function current(){
  const v=(new URLSearchParams(location.search).get('variant')||'A').toUpperCase();
  return VARIANTS.some(x=>x[0]===v)?v:'A';
}
function go(v){
  const u=new URL(location); u.searchParams.set('variant',v);
  history.replaceState({},'',u); doReset();
}
function doReset(){ S.answers={};S.cursor=0;S.started=false;S.log=[];S.entryFocus='cur';render() }
function el(id){return document.getElementById(id)}

function render(){
  const v=current(), meta=VARIANTS.find(x=>x[0]===v);
  el('vname').innerHTML=`Variant <b>${v}</b> — ${meta[1]} <span style="color:var(--ink3)">· ${meta[2]}</span>`;
  el('switch').innerHTML=`<button id="prev">‹</button>
    <span class="lab">${v} — ${meta[1]} <small>· ← →</small></span><button id="nextv">›</button>`;
  const i=VARIANTS.findIndex(x=>x[0]===v);
  el('prev').onclick=()=>go(VARIANTS[(i+2)%3][0]);
  el('nextv').onclick=()=>go(VARIANTS[(i+1)%3][0]);
  ({A:renderA,B:renderB,C:renderC})[v]();
}
document.addEventListener('keydown',e=>{
  const t=e.target.tagName;
  if(t==='TEXTAREA'||t==='INPUT'||e.target.isContentEditable) return;
  const i=VARIANTS.findIndex(x=>x[0]===current());
  if(e.key==='ArrowLeft') go(VARIANTS[(i+2)%3][0]);
  if(e.key==='ArrowRight') go(VARIANTS[(i+1)%3][0]);
});
el('reset').onclick=doReset;
el('peek').onclick=peek;
render();
</script>
</body>
